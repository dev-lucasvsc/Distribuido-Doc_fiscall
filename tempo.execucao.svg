<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" font-family="'DM Mono', 'Courier New', monospace">
  <!-- fundo -->
  <rect width="520" height="340" fill="#0f0e0c"/>

  <!-- título -->
  <text x="260" y="30" text-anchor="middle" fill="#e8e0d0" font-size="13" font-weight="bold">Tempo de Execução por Nº de Processos</text>
  <text x="260" y="48" text-anchor="middle" fill="#7a7060" font-size="10">16.000.000 registros · AMD Ryzen 7 5700X</text>

  <!-- área do gráfico: x=60..480, y=70..280 -->
  <!-- linhas de grade horizontais -->
  <line x1="60" y1="280" x2="480" y2="280" stroke="#2e2b26" stroke-width="1"/>
  <line x1="60" y1="222" x2="480" y2="222" stroke="#2e2b26" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="60" y1="164" x2="480" y2="164" stroke="#2e2b26" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="60" y1="106" x2="480" y2="106" stroke="#2e2b26" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="60" y1="70"  x2="480" y2="70"  stroke="#2e2b26" stroke-width="0.5" stroke-dasharray="4,3"/>

  <!-- labels eixo Y (0..240s mapeado em y=280..70) -->
  <!-- escala: 210 px / 240s = 0.875 px/s -->
  <!-- seq=232.27 → y=280-(232.27*0.875)=280-203.2=76.8 -->
  <!-- 2p=135.83  → y=280-(135.83*0.875)=280-118.9=161.1 -->
  <!-- 4p=70.34   → y=280-(70.34*0.875)=280-61.5=218.5 -->
  <!-- 8p=39.71   → y=280-(39.71*0.875)=280-34.7=245.3 -->
  <!-- 12p=34.74  → y=280-(34.74*0.875)=280-30.4=249.6 -->
  <text x="55" y="283" text-anchor="end" fill="#7a7060" font-size="9">0s</text>
  <text x="55" y="225" text-anchor="end" fill="#7a7060" font-size="9">60s</text>
  <text x="55" y="167" text-anchor="end" fill="#7a7060" font-size="9">120s</text>
  <text x="55" y="109" text-anchor="end" fill="#7a7060" font-size="9">180s</text>
  <text x="55" y="73"  text-anchor="end" fill="#7a7060" font-size="9">240s</text>

  <!-- eixo Y label -->
  <text x="18" y="175" text-anchor="middle" fill="#7a7060" font-size="9" transform="rotate(-90,18,175)">Tempo (s)</text>

  <!-- barras — x positions: seq=90, 2p=180, 4p=270, 8p=360, 12p=450; width=50 -->
  <!-- Seq -->
  <rect x="65"  y="77"  width="50" height="203" fill="#c84b31" rx="2"/>
  <text x="90"  y="72"  text-anchor="middle" fill="#e8e0d0" font-size="9">232,3s</text>

  <!-- 2 proc -->
  <rect x="155" y="161" width="50" height="119" fill="#e8a87c" rx="2"/>
  <text x="180" y="156" text-anchor="middle" fill="#e8e0d0" font-size="9">135,8s</text>

  <!-- 4 proc -->
  <rect x="245" y="218" width="50" height="62"  fill="#e8a87c" rx="2"/>
  <text x="270" y="213" text-anchor="middle" fill="#e8e0d0" font-size="9">70,3s</text>

  <!-- 8 proc -->
  <rect x="335" y="245" width="50" height="35"  fill="#6ab187" rx="2"/>
  <text x="360" y="240" text-anchor="middle" fill="#e8e0d0" font-size="9">39,7s</text>

  <!-- 12 proc -->
  <rect x="425" y="250" width="50" height="30"  fill="#6ab187" rx="2"/>
  <text x="450" y="245" text-anchor="middle" fill="#e8e0d0" font-size="9">34,7s</text>

  <!-- labels eixo X -->
  <text x="90"  y="296" text-anchor="middle" fill="#7a7060" font-size="9">Seq.</text>
  <text x="180" y="296" text-anchor="middle" fill="#7a7060" font-size="9">2</text>
  <text x="270" y="296" text-anchor="middle" fill="#7a7060" font-size="9">4</text>
  <text x="360" y="296" text-anchor="middle" fill="#7a7060" font-size="9">8</text>
  <text x="450" y="296" text-anchor="middle" fill="#7a7060" font-size="9">12</text>
  <text x="260" y="314" text-anchor="middle" fill="#7a7060" font-size="9">Nº de Processos</text>

  <!-- legenda -->
  <rect x="60"  y="325" width="10" height="8" fill="#c84b31" rx="1"/>
  <text x="74"  y="333" fill="#7a7060" font-size="8">Sequencial</text>
  <rect x="135" y="325" width="10" height="8" fill="#e8a87c" rx="1"/>
  <text x="149" y="333" fill="#7a7060" font-size="8">Paralelo</text>
  <rect x="200" y="325" width="10" height="8" fill="#6ab187" rx="1"/>
  <text x="214" y="333" fill="#7a7060" font-size="8">Melhor</text>
</svg>