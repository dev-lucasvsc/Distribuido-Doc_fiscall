<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" font-family="'DM Mono', 'Courier New', monospace">
  <rect width="520" height="340" fill="#0f0e0c"/>
  <text x="260" y="30" text-anchor="middle" fill="#e8e0d0" font-size="13" font-weight="bold">Tempo de Execução por Nº de Processos</text>
  <text x="260" y="48" text-anchor="middle" fill="#7a7060" font-size="10">16.000.000 registros · 16 CPUs lógicas</text>

  <!-- área x=60..480, y=70..280 — escala 0..260s → 210px / 260 = 0.808px/s -->
  <!-- seq=237.7843 → y=87.9, altura=192.1 -->
  <!-- 2p=133.1444  → y=172.5, altura=107.5 -->
  <!-- 4p=68.9927   → y=224.3, altura=55.7 -->
  <!-- 8p=38.5264   → y=248.9, altura=31.1 -->
  <!-- 12p=34.5666  → y=252.1, altura=27.9 -->

  <line x1="60" y1="280" x2="480" y2="280" stroke="#2e2b26" stroke-width="1"/>
  <line x1="60" y1="239" x2="480" y2="239" stroke="#2e2b26" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="60" y1="198" x2="480" y2="198" stroke="#2e2b26" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="60" y1="157" x2="480" y2="157" stroke="#2e2b26" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="60" y1="116" x2="480" y2="116" stroke="#2e2b26" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="60" y1="75"  x2="480" y2="75"  stroke="#2e2b26" stroke-width="0.5" stroke-dasharray="4,3"/>

  <text x="55" y="283" text-anchor="end" fill="#7a7060" font-size="9">0s</text>
  <text x="55" y="242" text-anchor="end" fill="#7a7060" font-size="9">50s</text>
  <text x="55" y="201" text-anchor="end" fill="#7a7060" font-size="9">100s</text>
  <text x="55" y="160" text-anchor="end" fill="#7a7060" font-size="9">150s</text>
  <text x="55" y="119" text-anchor="end" fill="#7a7060" font-size="9">200s</text>
  <text x="55" y="78"  text-anchor="end" fill="#7a7060" font-size="9">250s</text>
  <text x="18" y="175" text-anchor="middle" fill="#7a7060" font-size="9" transform="rotate(-90,18,175)">Tempo (s)</text>

  <!-- Seq -->
  <rect x="65"  y="88"  width="50" height="192" fill="#c84b31" rx="2"/>
  <text x="90"  y="83"  text-anchor="middle" fill="#e8e0d0" font-size="9">237,8s</text>
  <!-- 2p -->
  <rect x="155" y="173" width="50" height="107" fill="#e8a87c" rx="2"/>
  <text x="180" y="168" text-anchor="middle" fill="#e8e0d0" font-size="9">133,1s</text>
  <!-- 4p -->
  <rect x="245" y="224" width="50" height="56"  fill="#e8a87c" rx="2"/>
  <text x="270" y="219" text-anchor="middle" fill="#e8e0d0" font-size="9">69,0s</text>
  <!-- 8p -->
  <rect x="335" y="249" width="50" height="31"  fill="#e8a87c" rx="2"/>
  <text x="360" y="244" text-anchor="middle" fill="#e8e0d0" font-size="9">38,5s</text>
  <!-- 12p -->
  <rect x="425" y="252" width="50" height="28"  fill="#6ab187" rx="2"/>
  <text x="450" y="247" text-anchor="middle" fill="#e8e0d0" font-size="9">34,6s</text>

  <text x="90"  y="296" text-anchor="middle" fill="#7a7060" font-size="9">Seq.</text>
  <text x="180" y="296" text-anchor="middle" fill="#7a7060" font-size="9">2</text>
  <text x="270" y="296" text-anchor="middle" fill="#7a7060" font-size="9">4</text>
  <text x="360" y="296" text-anchor="middle" fill="#7a7060" font-size="9">8</text>
  <text x="450" y="296" text-anchor="middle" fill="#7a7060" font-size="9">12</text>
  <text x="260" y="314" text-anchor="middle" fill="#7a7060" font-size="9">Nº de Processos</text>

  <rect x="60"  y="325" width="10" height="8" fill="#c84b31" rx="1"/>
  <text x="74"  y="333" fill="#7a7060" font-size="8">Sequencial</text>
  <rect x="135" y="325" width="10" height="8" fill="#e8a87c" rx="1"/>
  <text x="149" y="333" fill="#7a7060" font-size="8">Paralelo</text>
  <rect x="200" y="325" width="10" height="8" fill="#6ab187" rx="1"/>
  <text x="214" y="333" fill="#7a7060" font-size="8">Melhor</text>
</svg>
