<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" font-family="'DM Mono', 'Courier New', monospace">
  <rect width="520" height="340" fill="#0f0e0c"/>
  <text x="260" y="30" text-anchor="middle" fill="#e8e0d0" font-size="13" font-weight="bold">Eficiência por Nº de Processos</text>
  <text x="260" y="48" text-anchor="middle" fill="#7a7060" font-size="10">Eficiência = Speedup(p) / p × 100%</text>

  <!-- escala 0..100 -> 2.1px/% -->
  <!-- 89.5->91.0 86.2->97.9 78.5->115.6 57.3->160.7 -->

  <line x1="60" y1="280" x2="480" y2="280" stroke="#2e2b26" stroke-width="1"/>
  <line x1="60" y1="280" x2="60"  y2="70"  stroke="#2e2b26" stroke-width="1"/>
  <line x1="60" y1="238" x2="480" y2="238" stroke="#2e2b26" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="60" y1="196" x2="480" y2="196" stroke="#2e2b26" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="60" y1="154" x2="480" y2="154" stroke="#2e2b26" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="60" y1="112" x2="480" y2="112" stroke="#2e2b26" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="60" y1="70"  x2="480" y2="70"  stroke="#2e2b26" stroke-width="0.5" stroke-dasharray="4,3"/>

  <text x="55" y="283" text-anchor="end" fill="#7a7060" font-size="9">0%</text>
  <text x="55" y="241" text-anchor="end" fill="#7a7060" font-size="9">20%</text>
  <text x="55" y="199" text-anchor="end" fill="#7a7060" font-size="9">40%</text>
  <text x="55" y="157" text-anchor="end" fill="#7a7060" font-size="9">60%</text>
  <text x="55" y="115" text-anchor="end" fill="#7a7060" font-size="9">80%</text>
  <text x="55" y="73"  text-anchor="end" fill="#7a7060" font-size="9">100%</text>
  <text x="18" y="175" text-anchor="middle" fill="#7a7060" font-size="9" transform="rotate(-90,18,175)">Eficiência (%)</text>

  <rect x="60" y="112" width="420" height="168" fill="#6ab187" fill-opacity="0.04" rx="2"/>
  <text x="66" y="122" fill="#6ab187" font-size="8" fill-opacity="0.6">zona aceitável (&gt;50%)</text>

  <!-- 2p(180,91) 4p(270,98) 8p(360,116) 12p(450,161) -->
  <polyline points="180,91 270,98 360,116 450,161"
            fill="none" stroke="#e8a87c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <polygon points="180,91 270,98 360,116 450,161 450,280 180,280"
           fill="#e8a87c" fill-opacity="0.07"/>

  <circle cx="180" cy="91"  r="5" fill="#e8a87c"/>
  <circle cx="270" cy="98"  r="5" fill="#e8a87c"/>
  <circle cx="360" cy="116" r="5" fill="#e8a87c"/>
  <circle cx="450" cy="161" r="5" fill="#c84b31"/>

  <text x="180" y="85"  text-anchor="middle" fill="#e8a87c" font-size="9" font-weight="bold">89,5%</text>
  <text x="270" y="92"  text-anchor="middle" fill="#e8a87c" font-size="9" font-weight="bold">86,2%</text>
  <text x="360" y="110" text-anchor="middle" fill="#e8a87c" font-size="9" font-weight="bold">78,5%</text>
  <text x="450" y="155" text-anchor="middle" fill="#c84b31" font-size="9" font-weight="bold">57,3%</text>

  <line x1="360" y1="116" x2="360" y2="65" stroke="#2e2b26" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="362" y="62" fill="#2e2b26" font-size="8">8 núcleos físicos:</text>
  <text x="362" y="72" fill="#2e2b26" font-size="8">ponto de melhor custo-benefício</text>

  <text x="180" y="296" text-anchor="middle" fill="#7a7060" font-size="9">2</text>
  <text x="270" y="296" text-anchor="middle" fill="#7a7060" font-size="9">4</text>
  <text x="360" y="296" text-anchor="middle" fill="#7a7060" font-size="9">8</text>
  <text x="450" y="296" text-anchor="middle" fill="#7a7060" font-size="9">12</text>
  <text x="260" y="314" text-anchor="middle" fill="#7a7060" font-size="9">Nº de Processos</text>

  <line x1="60" y1="329" x2="78" y2="329" stroke="#e8a87c" stroke-width="2.5"/>
  <circle cx="69" cy="329" r="4" fill="#e8a87c"/>
  <text x="82" y="333" fill="#7a7060" font-size="8">Eficiência real</text>
  <circle cx="195" cy="329" r="4" fill="#c84b31"/>
  <text x="202" y="333" fill="#7a7060" font-size="8">Queda (12p)</text>
  <rect x="290" y="323" width="10" height="8" fill="#6ab187" fill-opacity="0.3" rx="1"/>
  <text x="304" y="333" fill="#7a7060" font-size="8">Zona &gt;50%</text>
</svg>
